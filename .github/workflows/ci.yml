name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same branch/PR so pushes don't queue up stale CI runs.
# Deliberately NOT applied to the deploy jobs below (see their own concurrency
# group): a deploy that's already touching production must run to completion
# rather than being cancelled mid-way by the next push to main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Installs pnpm first so setup-node's pnpm cache step (below) can find it
      # on PATH. Version comes from the "packageManager" field in package.json,
      # so it never drifts from what's used locally. `package_json_file` must be
      # set explicitly: the action resolves it relative to the repository root
      # regardless of `defaults.run.working-directory` (which only applies to
      # `run:` steps), and this repo has no root-level package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.20.2"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Placeholder values only: nothing in this job talks to a real backend.
      # NEXT_PUBLIC_API_URL is inlined into the client bundle at build time,
      # so it must be set even though it's never called during the build.
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: http://localhost:8000
          INTERNAL_API_URL: http://localhost:8000
        run: pnpm build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: theatre_test
        ports:
          - 5432:5432
        # GitHub Actions blocks job steps until this reports healthy, so no
        # separate "wait for postgres" step is needed.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only database, isolated from local/dev credentials and reachable at
      # "localhost" because the service container's port is published to the runner host.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/theatre_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      # Proves the migration chain actually builds the schema from empty,
      # independent of the test suite's own create_all-based fixture.
      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Test
        run: uv run pytest

  # --- Continuous Delivery -----------------------------------------------
  #
  # Runs only for pushes to `main` (never for pull requests or other
  # branches), and only once both CI jobs above have already succeeded --
  # `needs: [frontend, backend]` makes a failed lint/test/build block
  # deployment instead of racing ahead of it. Nothing here repeats the
  # lint/type-check/test/build work those jobs already did.
  #
  # Flow: migrate (Alembic against the production DB) -> deploy-backend
  # (build/push image, update the Container App) -> deploy-frontend (same,
  # but also needs the backend's public URL as a build arg). See the
  # README's "Production Deployment" section for the full picture, including
  # the one-time Azure/GitHub setup this depends on (OIDC federation, the
  # `AZURE_*` secrets, and the `AZURE_*` / `BACKEND_PUBLIC_URL` variables
  # referenced below).
  migrate:
    name: "CD: Database migration"
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    environment: production
    # Shared across all three CD jobs: a second push to main while a deploy
    # is in flight queues behind it rather than racing it or being dropped.
    concurrency:
      group: cd-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      # If this fails, the job (and therefore both deploy jobs, via `needs`)
      # fails too: the app is never deployed against a schema it doesn't
      # match. Never runs anything destructive automatically -- only
      # `upgrade head`, which only ever applies forward migrations.
      - name: Apply pending Alembic migrations to production
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DATABASE_SSL_MODE: require
        run: uv run alembic upgrade head

  deploy-backend:
    name: "CD: Deploy backend"
    needs: [migrate]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: cd-production
      cancel-in-progress: false
    permissions:
      id-token: write # required by azure/login for OIDC
      contents: read
      packages: write # required to push to ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the commit SHA (for precise, auditable rollback -- see
      # README "Rollback") as well as `latest` (for convenience/inspection).
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point the backend Container App at the new image
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name "${{ vars.AZURE_BACKEND_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "ghcr.io/${{ github.repository }}/backend:${{ github.sha }}"

  deploy-frontend:
    name: "CD: Deploy frontend"
    needs: [deploy-backend]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: cd-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_API_URL must be supplied as a build arg (not just a
      # runtime container env var): Next.js inlines NEXT_PUBLIC_* values into
      # the client bundle at build time. See frontend/Dockerfile.prod.
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.BACKEND_PUBLIC_URL }}
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Point the frontend Container App at the new image
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name "${{ vars.AZURE_FRONTEND_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}"
