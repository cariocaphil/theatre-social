name: Bootstrap frontend image

"on":
  push:
    branches:
      - feature/6-azure-cd
  workflow_dispatch: {}

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend bootstrap image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://theatre-social-backend.orangerock-e8926e0f.swedencentral.azurecontainerapps.io
          tags: |
            ghcr.io/${{ github.repository }}/frontend:bootstrap
          cache-from: type=gha
          cache-to: type=gha,mode=max